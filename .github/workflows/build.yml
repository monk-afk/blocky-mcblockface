name: build

# build on c/cpp changes or workflow changes
on:
  push:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - 'util/ci/**'
      - '.github/workflows/**.yml'
  pull_request:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - 'util/ci/**'
      - '.github/workflows/**.yml'

jobs:
  # This is the current gcc compiler (available in jammy)
  gcc_10:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install deps
        run: |
          source ./util/ci/common.sh
          install_linux_deps g++-10

      - name: Build
        run: |
          ./util/ci/build.sh
        env:
          CC: gcc-10
          CXX: g++-10

      - name: Test
        run: |
          ./bin/squareoneserver --run-unittests

  # This is the current clang version
  clang_11:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install deps
        run: |
          source ./util/ci/common.sh
          install_linux_deps clang-11 valgrind libluajit-5.1-dev

      - name: Build
        run: |
          ./util/ci/build.sh
        env:
          CC: clang-11
          CXX: clang++-11
          CMAKE_FLAGS: "-DREQUIRE_LUAJIT=1"

      - name: Test
        run: |
          ./bin/squareoneserver --run-unittests

  docker:
    name: "Docker image"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Build docker image
        run: |
          docker build .

  msvc:
    name: VS 2022 ${{ matrix.config.arch }}-${{ matrix.type }}
    runs-on: windows-2022
    env:
      VCPKG_VERSION: ddf0518c31a259dcc359fd4c7bcb1ce8a27e9855
#                    2026.08.15
      vcpkg_packages: irrlicht zlib curl[ssl] sqlite3 luajit gmp jsoncpp
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
              arch: x86,
              generator: "-G'Visual Studio 17 2022' -A Win32",
              vcpkg_triplet: x86-windows
            }
          - {
              arch: x64,
              generator: "-G'Visual Studio 17 2022' -A x64",
              vcpkg_triplet: x64-windows
            }
        type: [portable]
#        type: [portable, installer]
# The installer type is working, but disabled, to save runner jobs.
# Enable it, when working on the installer.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: '${{ github.workspace }}\vcpkg_cache'
          key: vcpkg-${{ runner.os }}-${{ matrix.config.vcpkg_triplet }}-${{ env.VCPKG_VERSION }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.config.vcpkg_triplet }}-${{ env.VCPKG_VERSION }}-

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}\vcpkg'
          vcpkgGitCommitId: ${{ env.VCPKG_VERSION }}

      - name: Install vcpkg dependencies
        run: |
          $packages = $env:vcpkg_packages.Split(' ')
          & "$env:VCPKG_ROOT\vcpkg.exe" install @packages --triplet $env:VCPKG_DEFAULT_TRIPLET
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.config.vcpkg_triplet }}
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg_cache,readwrite

      - name: CMake
        run: |
          cmake ${{matrix.config.generator}}  `
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake"  `
          -DCMAKE_BUILD_TYPE=Release  `
          -DENABLE_POSTGRESQL=OFF  `
          -DRUN_IN_PLACE=${{ contains(matrix.type, 'portable') }} .

      - name: Build
        run: cmake --build . --config Release

      - name: CPack
        run: |
          If ($env:TYPE -eq "installer")
          {
            cpack -G WIX -B "$env:GITHUB_WORKSPACE\Package"
          }
          ElseIf($env:TYPE -eq "portable")
          {
            cpack -G ZIP -B "$env:GITHUB_WORKSPACE\Package"
          }
        env:
          TYPE: ${{matrix.type}}

      - name: Package Clean
        run: rm -r $env:GITHUB_WORKSPACE\Package\_CPack_Packages

      - uses: actions/upload-artifact@v7
        with:
          name: squareone-core-msvc-${{ matrix.config.arch }}-${{ matrix.type }}
          path: .\Package\
